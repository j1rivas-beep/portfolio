<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Development Explorer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <h1>Poverty and Growth of a Coutry</h1>

    <p>Choose the variables you want to compare:</p>

    <label>X-axis:</label>
    <select id="xVariable">
        <option value="poverty">Poverty gap ($5.50)</option>
        <option value="gini">Income inequality (Gini index)</option>
        <option value="education">Secondary school enrollment (%)</option>
        <option value="dependency">Age dependency ratio (%)</option>
        <option value="population">Population growth (%)</option>
    </select>

    <label>Y-axis:</label>
    <select id="yVariable">
        <option value="gdp">GDP growth (annual %)</option>
        <option value="poverty">Poverty gap ($5.50)</option>
        <option value="gini">Income inequality (Gini index)</option>
        <option value="education">Secondary school enrollment (%)</option>
        <option value="dependency">Age dependency ratio (%)</option>
        <option value="population">Population growth (%)</option>
    </select>

    <div id="chart"></div>

    <script>
        // Load all four CSV files
        Promise.all([
            d3.csv("poverty.csv", d3.autoType),
            d3.csv("health.csv", d3.autoType),
            d3.csv("education.csv", d3.autoType),
            d3.csv("economy-and-growth.csv", d3.autoType)
        ]).then(([poverty, health, education, economy]) => {

            // Match records using country code and year
            const healthMap = new Map(
                health.map(d => [d["Country Code"] + "_" + d.Year, d])
            );

            const educationMap = new Map(
                education.map(d => [d["Country Code"] + "_" + d.Year, d])
            );

            const economyMap = new Map(
                economy.map(d => [d["Country Code"] + "_" + d.Year, d])
            );

            // Combine matching records in JavaScript
            const data = poverty.map(p => {
                const key = p["Country Code"] + "_" + p.Year;

                return {
                    country: p["Country Name"],
                    year: p.Year,

                    poverty: p["average_value_Poverty gap at $5.50 a day (2011 PPP) (%)"],
                    gini: p["average_value_Gini index (World Bank estimate)"],

                    dependency: healthMap.get(key)?.["average_value_Age dependency ratio (% of working-age population)"],
                    population: healthMap.get(key)?.["average_value_Population growth (annual %)"],

                    education: educationMap.get(key)?.["average_value_School enrollment, secondary (% gross)"],

                    gdp: economyMap.get(key)?.["average_value_GDP growth (annual %)"]
                };
            });

            // Keep records with valid values for both selected variables
            function drawChart() {
                const xVariable = document.getElementById("xVariable").value;
                const yVariable = document.getElementById("yVariable").value;

                const filteredData = data.filter(d =>
                    Number.isFinite(d[xVariable]) &&
                    Number.isFinite(d[yVariable])
                );

                d3.select("#chart").selectAll("*").remove();

                const width = 850;
                const height = 550;
                const margin = {top: 30, right: 30, bottom: 70, left: 80};

                const svg = d3.select("#chart")
                    .append("svg")
                    .attr("width", width)
                    .attr("height", height);

                const x = d3.scaleLinear()
                    .domain(d3.extent(filteredData, d => d[xVariable]))
                    .nice()
                    .range([margin.left, width - margin.right]);

                const y = d3.scaleLinear()
                    .domain(d3.extent(filteredData, d => d[yVariable]))
                    .nice()
                    .range([height - margin.bottom, margin.top]);

                svg.append("g")
                    .attr("transform", `translate(0,${height - margin.bottom})`)
                    .call(d3.axisBottom(x));

                svg.append("g")
                    .attr("transform", `translate(${margin.left},0)`)
                    .call(d3.axisLeft(y));

                svg.append("text")
                    .attr("x", width / 2)
                    .attr("y", height - 15)
                    .attr("text-anchor", "middle")
                    .text(xVariable);

                svg.append("text")
                    .attr("transform", "rotate(-90)")
                    .attr("x", -height / 2)
                    .attr("y", 20)
                    .attr("text-anchor", "middle")
                    .text(yVariable);

                svg.selectAll("circle")
                    .data(filteredData)
                    .join("circle")
                    .attr("cx", d => x(d[xVariable]))
                    .attr("cy", d => y(d[yVariable]))
                    .attr("r", 4)
                    .attr("fill", "steelblue")
                    .attr("opacity", 0.6)
                    .append("title")
                    .text(d => `${d.country} (${d.year})`);

                svg.append("text")
                    .attr("x", margin.left)
                    .attr("y", 20)
                    ;
            }

            document.getElementById("xVariable").addEventListener("change", drawChart);
            document.getElementById("yVariable").addEventListener("change", drawChart);

            drawChart();
        });
    </script>
</body>
</html>
